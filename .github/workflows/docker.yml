name: "Docker"

on:
  workflow_dispatch:

  push:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: "Build (${{ matrix.image }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [mcp]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: make install DOCKER_VARIANT=${{ matrix.image }}

      - name: Typecheck
        run: make typecheck DOCKER_VARIANT=${{ matrix.image }}

      - name: Test
        run: make test DOCKER_VARIANT=${{ matrix.image }}

      # Builds into the local Docker daemon, so no export or import step
      - name: Build image
        run: make build DOCKER_VARIANT=${{ matrix.image }}

      - name: Smoke test image
        run: make test-docker DOCKER_VARIANT=${{ matrix.image }}

      - name: Login to DockerHub
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/setup-buildx-action@v4

      - name: Push image
        if: ${{ github.ref == 'refs/heads/master' }}
        run: make push DOCKER_VARIANT=${{ matrix.image }}

  docs:
    name: "Docs"
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/dummy"
